<!--
Magento_Ui's grid/cells/actions.html, with a marker below the actions when the order's last MyParcel
export failed. The reason is in its tooltip, the order view and the options modal.
Keep the actions markup in step with that template.
-->
<!-- ko if: $row() -->
<a
    class="action-menu-item"
    if="$col.isSingle($row()._rowIndex)"
    repeat="foreach: $col.getVisibleActions($row()._rowIndex), item: '$action'"
    click="$col.getActionHandler($action())"
    text="$action().label"
    attr="target: $col.getTarget($action()), href: $action().href, 'aria-label': $action().ariaLabel"></a>

<div class="action-select-wrap" if="$col.isMultiple($row()._rowIndex)" collapsible>
    <button class="action-select" translate="'Select'" toggleCollapsible></button>
    <ul class="action-menu" css="_active: $collapsible.opened">
        <li repeat="foreach: $col.getVisibleActions($row()._rowIndex), item: '$action'">
            <a class="action-menu-item" click="$col.getActionHandler($action())" text="$action().label" attr="target: $col.getTarget($action()), href: $action().href, 'data-action': 'item-' + $action().index"></a>
        </li>
    </ul>
</div>

<div class="mypa-grid-export-error"
     if="$row().myparcel_export_error"
     translate="'Export error'"
     attr="title: $row().myparcel_export_error"
     style="color: #e22626; margin-top: 0.5rem;"></div>
<!-- /ko -->
