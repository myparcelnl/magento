name: '⚙️ On push'

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  rebase-prs:
    uses: ./.github/workflows/rebase-prs.yml
    needs:
      - test
      - lint
    secrets: inherit
