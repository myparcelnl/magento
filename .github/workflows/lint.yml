name: '🔍 Lint'

on:
  workflow_call:

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint
