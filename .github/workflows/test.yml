name: '🧪 Run tests'

on:
  workflow_call:
    inputs:
      ref:
        description: 'Ref to run on'
        type: string
        required: false

jobs:
  test-backend:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    container:
      image: ghcr.io/myparcelnl/php-xd:${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=ext-*

      - name: Run tests
        run: vendor/bin/pest --testsuite=Unit --test-directory=Tests
