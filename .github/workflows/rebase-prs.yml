name: '♻️ Rebase PRs'

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rebase-prs:
    runs-on: ubuntu-latest
    steps:
      - uses: myparcelnl/actions/rebase-prs@v5
        with:
          app-id: ${{ secrets.MYPARCEL_APP_ID }}
          private-key: ${{ secrets.MYPARCEL_APP_PRIVATE_KEY }}
          base: ${{ github.ref_name }}
          exclude-drafts: true
          exclude-labels: 'dependencies'
